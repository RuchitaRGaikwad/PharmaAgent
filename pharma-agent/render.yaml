# Render Blueprint - PharmaAgent Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pharma-agent-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: DATABASE_URL
        value: sqlite:///./pharma_agent.db
